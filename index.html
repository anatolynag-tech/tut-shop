<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ТУТ | Премиальные добавки</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/manrope@5.0.20/index.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/playfair-display@5.0.13/index.css">
    <style>
        :root {
            --bg1: #05160E; --bg2: #0A2216;
            --gold: #D4AF37; --gold-soft: #E9C463; --mint: #BFE3CF;
            --txt: #E8F3EC; --dim: #9DB8A9;
            --card: rgba(255,255,255,.045); --line: rgba(212,175,55,.22);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Manrope', system-ui, sans-serif; color: var(--txt);
            background: linear-gradient(160deg, var(--bg1), var(--bg2) 55%, var(--bg1));
            min-height: 100vh; padding-bottom: 80px;
        }
        h1, h2, h3, .serif { font-family: 'Playfair Display', serif; }
        
        /* Шапка */
        .header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 20px 24px; border-bottom: 1px solid rgba(212,175,55,.15);
            position: sticky; top: 0; z-index: 50; background: rgba(5,22,14,.9); backdrop-filter: blur(10px);
        }
        .emblem { width: 40px; height: 40px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #12291C, #060D09 70%); border: 1px solid rgba(212,175,55,.45); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 11px; color: var(--mint); box-shadow: 0 0 18px rgba(212,175,55,.18); }
        .header-title { font-size: 18px; color: var(--gold-soft); }
        .cart-btn { background: rgba(212,175,55,.15); border: 1px solid var(--gold); color: var(--gold-soft); padding: 8px 16px; border-radius: 20px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .cart-btn:hover { background: rgba(212,175,55,.3); }

        /* Заголовок */
        .page-title { text-align: center; padding: 40px 20px 20px; margin-top: 20px; }
        .page-title h1 { font-size: clamp(28px, 5vw, 48px); text-transform: uppercase; letter-spacing: 0.05em; color: var(--gold-soft); text-shadow: 0 0 20px rgba(212,175,55,.5); margin-bottom: 10px; }
        .page-title p { color: var(--dim); font-size: 15px; max-width: 600px; margin: 0 auto; }

        /* Карусель */
        .carousel-container {
            display: flex; overflow-x: auto; scroll-snap-type: x mandatory;
            padding: 40px 20px; gap: 20px;
            cursor: grab;
            -webkit-overflow-scrolling: touch;
        }
        .carousel-container:active { cursor: grabbing; }
        .carousel-container::-webkit-scrollbar { height: 8px; }
        .carousel-container::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); border-radius: 4px; }
        .carousel-container::-webkit-scrollbar-thumb { background: rgba(212,175,55,0.3); border-radius: 4px; }
        
        .carousel-item {
            flex: 0 0 280px;
            scroll-snap-align: center; transition: all 0.4s ease;
            transform: scale(0.85); opacity: 0.6;
            display: flex; flex-direction: column; align-items: center;
            user-select: none;
        }
        
        .carousel-item.active {
            transform: scale(1); opacity: 1;
        }

        @media (max-width: 600px) {
            .carousel-item { flex: 0 0 75vw; }
            .carousel-container { padding: 20px 10px; }
            .carousel-container::-webkit-scrollbar { display: none; }
        }

        /* Карточка */
        .card {
            background: var(--card); border: 1px solid rgba(255,255,255,.08);
            border-radius: 24px; padding: 30px 20px; width: 100%;
            display: flex; flex-direction: column; align-items: center; text-align: center;
            transition: border-color 0.3s, box-shadow 0.3s;
            pointer-events: none;
        }
        .card button { pointer-events: auto; }
        
        .card:hover { border-color: rgba(212,175,55,.5); box-shadow: 0 10px 40px rgba(0,0,0,.5); }
        
        .card-img { width: 120px; height: 140px; margin-bottom: 20px; position: relative; }
        .card h3 { font-size: 20px; color: var(--gold-soft); margin-bottom: 8px; }
        .card .subtitle { font-size: 12px; color: var(--mint); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 12px; }
        .card p { font-size: 13px; color: var(--dim); margin-bottom: 20px; line-height: 1.5; flex-grow: 1; }
        .card .price { font-size: 24px; font-weight: 800; color: var(--gold-soft); margin-bottom: 15px; }
        
        .btn-add { background: linear-gradient(135deg, #E9C463, #B8860B); color: #0A1A10; border: none; border-radius: 999px; padding: 12px 20px; font-weight: 800; font-size: 14px; cursor: pointer; width: 100%; transition: 0.3s; }
        .btn-add:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(212,175,55,.3); }

        /* Модальное окно */
        .modal { position: fixed; inset: 0; background: rgba(2,10,6,0.8); backdrop-filter: blur(10px); z-index: 100; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal.on { display: flex; }
        .modal-box { background: linear-gradient(175deg, #0B2417, #071B11); border: 1px solid rgba(212,175,55,.4); border-radius: 28px; max-width: 500px; width: 100%; padding: 30px; max-height: 85vh; overflow-y: auto; position: relative; }
        .modal-x { position: absolute; top: 15px; right: 15px; background: none; border: none; color: var(--dim); font-size: 24px; cursor: pointer; }
        
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid rgba(255,255,255,.1); font-size: 14px; }
        .cart-total { display: flex; justify-content: space-between; font-size: 18px; font-weight: 700; color: var(--gold-soft); margin: 20px 0; }

        /* Форма */
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; color: var(--dim); margin-bottom: 5px; }
        .form-group input { width: 100%; background: rgba(0,0,0,.4); border: 1px solid rgba(255,255,255,.1); border-radius: 12px; color: var(--txt); padding: 12px; font-size: 14px; outline: none; }
        .form-group input:focus { border-color: var(--gold); }
        .btn-pay { background: linear-gradient(135deg, #E9C463, #B8860B); color: #0A1A10; border: none; border-radius: 999px; padding: 15px; font-weight: 800; font-size: 16px; cursor: pointer; width: 100%; margin-top: 20px; transition: 0.3s; }
        .btn-pay:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(212,175,55,.3); }
    </style>
</head>
<body>

    <div class="header">
        <div style="display: flex; align-items: center; gap: 10px;">
            <div class="emblem">ТУТ</div>
            <div class="header-title serif">Премиум</div>
        </div>
        <button class="cart-btn" onclick="openCart()">Корзина (<span id="cartCount">0</span>)</button>
    </div>

    <div class="page-title">
        <h1>Витрина добавок</h1>
        <p>Разработано практикующим врачом. Уникальный состав на основе доказательной медицины.</p>
    </div>

    <div class="carousel-container" id="carousel"></div>

    <div class="modal" id="cartModal">
        <div class="modal-box">
            <button class="modal-x" onclick="closeCart()">✕</button>
            <h2 class="serif" style="text-align: center; color: var(--gold-soft); margin-bottom: 20px;">Ваш заказ</h2>
            
            <div id="cartItems"></div>
            <div class="cart-total">
                <span>Итого:</span>
                <span id="cartTotalPrice">0 ₽</span>
            </div>

            <div id="orderForm">
                <div class="form-group">
                    <label>ФИО</label>
                    <input type="text" id="userName" placeholder="Иванов Иван Иванович">
                </div>
                <div class="form-group">
                    <label>Телефон</label>
                    <input type="tel" id="userPhone" placeholder="+7 (999) 999-99-99">
                </div>
                <div class="form-group">
                    <label>Адрес доставки по Челябинску</label>
                    <input type="text" id="userAddress" placeholder="Например: ЧМЗ, ул. Богдана Хмельницкого, 15">
                </div>
                <button class="btn-pay" onclick="submitOrder()">Перейти к оплате</button>
            </div>
        </div>
    </div>

    <script>
        // Данные товаров
        const products = [
            { id: 1, name: 'Магний бисглицинат', sub: 'Сон и восстановление', desc: 'Премиальная форма хелатного магния. 360 мг элементарного магния в 3 капсулах для максимального эффекта. 90 капсул.', price: 1300 },
            { id: 2, name: 'D3 + K2', sub: 'Иммунитет и кости', desc: 'Капсулы для поддержки иммунитета и здоровья костей.', price: 0 },
            { id: 3, name: 'Магний порошковый', sub: 'Большая банка', desc: 'Удобная форма для тех, кто не любит капсулы.', price: 0 },
            { id: 4, name: 'B-комплекс Премиум', sub: 'Энергия и нервная система', desc: 'Активные формы витаминов группы B.', price: 0 },
            { id: 5, name: 'Омега-3', sub: 'Сердце и мозг', desc: 'Высокая концентрация EPA/DHA.', price: 0 }
        ];

        const carousel = document.getElementById('carousel');
        
        // Создание карточек
        products.forEach(p => {
            const item = document.createElement('div');
            item.className = 'carousel-item';
            
            const card = document.createElement('div');
            card.className = 'card';
            
            // Банка с этикеткой
            const imgDiv = document.createElement('div');
            imgDiv.className = 'card-img';
            
            const jar = document.createElement('div');
            jar.style.width = '80px';
            jar.style.height = '120px';
            jar.style.background = 'linear-gradient(90deg, #1A0D06 0%, #3E1F0F 20%, #5C331A 50%, #3E1F0F 80%, #1A0D06 100%)';
            jar.style.borderRadius = '12px 12px 16px 16px';
            jar.style.margin = '0 auto';
            jar.style.position = 'relative';
            jar.style.boxShadow = 'inset -5px 0 15px rgba(0,0,0,0.8), inset 5px 0 15px rgba(0,0,0,0.5), 0 10px 20px rgba(0,0,0,0.5)';
            
            const lid = document.createElement('div');
            lid.style.width = '84px';
            lid.style.height = '25px';
            lid.style.background = 'linear-gradient(90deg, #0A0A0A 0%, #222 50%, #0A0A0A 100%)';
            lid.style.borderRadius = '6px 6px 2px 2px';
            lid.style.position = 'absolute';
            lid.style.top = '-15px';
            lid.style.left = '-2px';
            lid.style.boxShadow = 'inset 0 -2px 5px rgba(255,255,255,0.1), 0 2px 5px rgba(0,0,0,0.5)';
            
            const label = document.createElement('div');
            label.style.width = '74px';
            label.style.height = '60px';
            label.style.background = '#E8DCC4';
            label.style.position = 'absolute';
            label.style.top = '35px';
            label.style.left = '3px';
            label.style.borderRadius = '2px';
            label.style.display = 'flex';
            label.style.flexDirection = 'column';
            label.style.alignItems = 'center';
            label.style.justifyContent = 'center';
            label.style.boxShadow = 'inset 0 0 5px rgba(0,0,0,0.2)';
            label.style.fontFamily = 'sans-serif';
            
            // Надписи на этикетке
            let labelName = 'ПРЕМИУМ';
            let labelSub = '90 КАПС';
            if (p.id === 1) { labelName = 'МАГНИЙ'; labelSub = 'BISGLYCINATE'; }
            if (p.id === 2) { labelName = 'D3 + K2'; labelSub = 'PREMIUM'; }
            if (p.id === 3) { labelName = 'МАГНИЙ'; labelSub = 'ПОРОШОК'; }
            if (p.id === 4) { labelName = 'B-КОМПЛЕКС'; labelSub = 'PREMIUM'; }
            if (p.id === 5) { labelName = 'ОМЕГА-3'; labelSub = 'PREMIUM'; }

            label.innerHTML = `
                <div style="font-size: 6px; color: #8a6a14; letter-spacing: 1px; margin-bottom: 2px;">TUT HEALTH</div>
                <div style="font-size: 10px; font-weight: bold; color: #1A0D06; font-family: serif;">${labelName}</div>
                <div style="font-size: 5px; color: #5C331A; margin-top: 2px;">${labelSub}</div>
                <div style="width: 20px; height: 1px; background: #8a6a14; margin: 3px 0;"></div>
                <div style="font-size: 5px; color: #5C331A;">${p.id === 3 ? 'БОЛЬШАЯ БАНКА' : '90 КАПСУЛ'}</div>
            `;
            
            jar.appendChild(lid);
            jar.appendChild(label);
            imgDiv.appendChild(jar);
            
            const h3 = document.createElement('h3');
            h3.textContent = p.name;
            
            const sub = document.createElement('div');
            sub.className = 'subtitle';
            sub.textContent = p.sub;
            
            const desc = document.createElement('p');
            desc.textContent = p.desc;
            
            const price = document.createElement('div');
            price.className = 'price';
            price.textContent = p.price > 0 ? `${p.price} ₽` : 'Скоро';
            
            const btn = document.createElement('button');
            btn.className = 'btn-add';
            btn.textContent = 'В корзину';
            btn.onclick = () => addToCart(p.id);
            
            card.append(imgDiv, h3, sub, desc, price, btn);
            item.appendChild(card);
            carousel.appendChild(item);
        });

        // --- ЛОГИКА ПЕРЕТАСКИВАНИЯ (DRAG TO SCROLL) ---
        let isDown = false;
        let startX;
        let scrollLeft;

        carousel.addEventListener('mousedown', (e) => {
            isDown = true;
            carousel.style.cursor = 'grabbing';
            startX = e.pageX - carousel.offsetLeft;
            scrollLeft = carousel.scrollLeft;
        });

        carousel.addEventListener('mouseleave', () => {
            isDown = false;
            carousel.style.cursor = 'grab';
        });

        carousel.addEventListener('mouseup', () => {
            isDown = false;
            carousel.style.cursor = 'grab';
        });

        carousel.addEventListener('mousemove', (e) => {
            if (!isDown) return;
            e.preventDefault();
            const x = e.pageX - carousel.offsetLeft;
            const walk = (x - startX) * 2;
            carousel.scrollLeft = scrollLeft - walk;
        });

        // Эффект карусели
        const items = document.querySelectorAll('.carousel-item');
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('active');
                } else {
                    entry.target.classList.remove('active');
                }
            });
        }, { root: carousel, threshold: 0.6 });
        items.forEach(item => observer.observe(item));

        // Корзина
        let cart = [];
        
        function addToCart(id) {
            const product = products.find(p => p.id === id);
            if (product.price === 0) {
                alert('Этот товар пока в разработке. Мы сообщим о старте продаж!');
                return;
            }
            
            const existingItem = cart.find(item => item.id === id);
            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            
            updateCart();
        }

        function updateCart() {
            document.getElementById('cartCount').textContent = cart.reduce((sum, item) => sum + item.quantity, 0);
            const cartItems = document.getElementById('cartItems');
            const cartTotal = document.getElementById('cartTotalPrice');
            
            cartItems.textContent = ''; 
            
            if (cart.length === 0) {
                const empty = document.createElement('p');
                empty.style.textAlign = 'center';
                empty.style.color = 'var(--dim)';
                empty.style.padding = '20px 0';
                empty.textContent = 'Корзина пуста';
                cartItems.appendChild(empty);
                cartTotal.textContent = '0 ₽';
                return;
            }

            let total = 0;
            cart.forEach((item, index) => {
                const row = document.createElement('div');
                row.className = 'cart-item';
                
                // Левая часть: Название
                const nameSpan = document.createElement('span');
                nameSpan.textContent = item.name;
                nameSpan.style.flex = '1';
                nameSpan.style.marginRight = '10px';
                
                // Правая часть: Кнопки +/-, Сумма, Удаление
                const controlsDiv = document.createElement('div');
                controlsDiv.style.display = 'flex';
                controlsDiv.style.alignItems = 'center';
                controlsDiv.style.gap = '15px';
                
                // 1. Блок с кнопками +/-
                const qtyDiv = document.createElement('div');
                qtyDiv.style.display = 'flex';
                qtyDiv.style.alignItems = 'center';
                qtyDiv.style.gap = '6px';
                
                const minusBtn = document.createElement('button');
                minusBtn.textContent = '-';
                minusBtn.style.background = 'rgba(255,255,255,0.1)';
                minusBtn.style.border = 'none';
                minusBtn.style.color = 'white';
                minusBtn.style.borderRadius = '50%';
                minusBtn.style.width = '26px';
                minusBtn.style.height = '26px';
                minusBtn.style.display = 'flex';
                minusBtn.style.alignItems = 'center';
                minusBtn.style.justifyContent = 'center';
                minusBtn.style.cursor = 'pointer';
                minusBtn.style.fontSize = '16px';
                minusBtn.onclick = () => changeQuantity(index, -1);
                
                const qtySpan = document.createElement('span');
                qtySpan.textContent = item.quantity;
                qtySpan.style.minWidth = '15px';
                qtySpan.style.textAlign = 'center';
                
                const plusBtn = document.createElement('button');
                plusBtn.textContent = '+';
                plusBtn.style.background = 'rgba(255,255,255,0.1)';
                plusBtn.style.border = 'none';
                plusBtn.style.color = 'white';
                plusBtn.style.borderRadius = '50%';
                plusBtn.style.width = '26px';
                plusBtn.style.height = '26px';
                plusBtn.style.display = 'flex';
                plusBtn.style.alignItems = 'center';
                plusBtn.style.justifyContent = 'center';
                plusBtn.style.cursor = 'pointer';
                plusBtn.style.fontSize = '16px';
                plusBtn.onclick = () => changeQuantity(index, 1);
                
                qtyDiv.append(minusBtn, qtySpan, plusBtn);
                
                // 2. Блок с суммой и крестиком
                const priceDelDiv = document.createElement('div');
                priceDelDiv.style.display = 'flex';
                priceDelDiv.style.alignItems = 'center';
                priceDelDiv.style.gap = '10px';
                priceDelDiv.style.minWidth = '80px';
                priceDelDiv.style.justifyContent = 'flex-end';

                const priceSpan = document.createElement('span');
                priceSpan.textContent = `${item.price * item.quantity} ₽`;
                priceSpan.style.whiteSpace = 'nowrap';
                priceSpan.style.fontWeight = '600';
                
                const delBtn = document.createElement('button');
                delBtn.textContent = '✕';
                delBtn.style.background = 'none';
                delBtn.style.border = 'none';
                delBtn.style.color = '#ff6b6b';
                delBtn.style.fontSize = '18px';
                delBtn.style.cursor = 'pointer';
                delBtn.style.padding = '0 5px';
                delBtn.onclick = () => removeFromCart(index);
                
                priceDelDiv.append(priceSpan, delBtn);
                
                controlsDiv.append(qtyDiv, priceDelDiv);
                row.append(nameSpan, controlsDiv);
                cartItems.appendChild(row);
                
                total += item.price * item.quantity;
            });
            cartTotal.textContent = `${total} ₽`;
        }

        function changeQuantity(index, delta) {
            const item = cart[index];
            item.quantity += delta;
            
            if (item.quantity <= 0) {
                cart.splice(index, 1);
            }
            updateCart();
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCart();
        }

        function openCart() {
            document.getElementById('cartModal').classList.add('on');
            updateCart();
        }

        function closeCart() {
            document.getElementById('cartModal').classList.remove('on');
        }

        function submitOrder() {
            const nameInput = document.getElementById('userName');
            const phoneInput = document.getElementById('userPhone');
            const addressInput = document.getElementById('userAddress');

            if (!nameInput.value.trim() || !phoneInput.value.trim() || !addressInput.value.trim()) {
                alert('Пожалуйста, заполните все поля');
                return;
            }

            // Считаем итоговую сумму
            const total = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);

            // Выбираем нужную ссылку в зависимости от суммы
            let payUrl = '';
            if (total === 1300) {
                payUrl = 'https://auth.robokassa.ru/merchant/Invoice/t26qZIDK5ECFK65vOn83QA';
            } else if (total === 2600) {
                payUrl = 'https://auth.robokassa.ru/merchant/Invoice/CRBizY3IXUy0AARYxuHAvw';
            } else if (total === 3900) {
                payUrl = 'https://auth.robokassa.ru/merchant/Invoice/nq5cgFvZiEGDPxy_3TRGYA';
            } else if (total === 5200) {
                payUrl = 'https://auth.robokassa.ru/merchant/Invoice/8xoP89_5D0-aMbJU1CsMyQ';
            } else {
                alert('Пожалуйста, свяжитесь с нами для оформления заказа на сумму ' + total + ' ₽');
                return;
            }

            const formData = {
                name: nameInput.value.trim(),
                phone: phoneInput.value.trim(),
                address: addressInput.value.trim(),
                items: cart.map(item => `${item.name} (${item.quantity} шт.)`).join(', '),
                total: total
            };

            // Меняем текст кнопки, чтобы клиент понял, что идет отправка
            const submitBtn = document.querySelector('.btn-pay');
            const originalText = submitBtn.textContent;
            submitBtn.textContent = 'Отправка...';
            submitBtn.disabled = true;

            fetch('https://formspree.io/f/xrppdype', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify(formData)
            }).then(() => {
                // Перекидываем на нужную ссылку Робокассы
                window.location.href = payUrl;
            }).catch(() => {
                alert('Ошибка отправки заказа. Попробуйте еще раз.');
                submitBtn.textContent = originalText;
                submitBtn.disabled = false;
            });
        }
    </script>
</body>
</html>
