<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ТУТ | Премиальные добавки</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/manrope@5.0.20/index.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/playfair-display@5.0.13/index.css">
    <style>
        :root {
            --bg1: #05160E; --bg2: #0A2216;
            --gold: #D4AF37; --gold-soft: #E9C463; --mint: #BFE3CF;
            --txt: #E8F3EC; --dim: #9DB8A9;
            --card: rgba(255,255,255,.045); --line: rgba(212,175,55,.22);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Manrope', system-ui, sans-serif; color: var(--txt);
            background: linear-gradient(160deg, var(--bg1), var(--bg2) 55%, var(--bg1));
            min-height: 100vh; padding-bottom: 80px;
        }
        h1, h2, h3, .serif { font-family: 'Playfair Display', serif; }
        
        .header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 20px 24px; border-bottom: 1px solid rgba(212,175,55,.15);
            position: sticky; top: 0; z-index: 50; background: rgba(5,22,14,.9); backdrop-filter: blur(10px);
        }
        .emblem { width: 40px; height: 40px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #12291C, #060D09 70%); border: 1px solid rgba(212,175,55,.45); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 11px; color: var(--mint); box-shadow: 0 0 18px rgba(212,175,55,.18); }
        .header-title { font-size: 18px; color: var(--gold-soft); }
        .cart-btn { background: rgba(212,175,55,.15); border: 1px solid var(--gold); color: var(--gold-soft); padding: 8px 16px; border-radius: 20px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .cart-btn:hover { background: rgba(212,175,55,.3); }

        .page-title { text-align: center; padding: 40px 20px 20px; }
        .page-title h1 { font-size: clamp(28px, 5vw, 48px); text-transform: uppercase; letter-spacing: 0.05em; color: var(--gold-soft); text-shadow: 0 0 20px rgba(212,175,55,.5); margin-bottom: 10px; }
        .page-title p { color: var(--dim); font-size: 15px; max-width: 600px; margin: 0 auto; }

        .carousel-container {
            display: flex; overflow-x: auto; scroll-snap-type: x mandatory;
            padding: 40px 0; gap: 20px; scrollbar-width: none; -ms-overflow-style: none;
        }
        .carousel-container::-webkit-scrollbar { display: none; }
        
        .carousel-item {
            flex: 0 0 280px; scroll-snap-align: center; transition: all 0.4s ease;
            transform: scale(0.85); opacity: 0.6;
            display: flex; flex-direction: column; align-items: center;
        }
        .carousel-item.active { transform: scale(1); opacity: 1; }

        .card {
            background: var(--card); border: 1px solid rgba(255,255,255,.08);
            border-radius: 24px; padding: 30px 20px; width: 100%;
            display: flex; flex-direction: column; align-items: center; text-align: center;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .card:hover { border-color: rgba(212,175,55,.5); box-shadow: 0 10px 40px rgba(0,0,0,.5); }
        
        .card-img { width: 120px; height: 120px; border-radius: 50%; background: rgba(212,175,55,0.1); display: flex; align-items: center; justify-content: center; font-size: 40px; margin-bottom: 20px; }
        .card h3 { font-size: 20px; color: var(--gold-soft); margin-bottom: 8px; }
        .card .subtitle { font-size: 12px; color: var(--mint); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 12px; }
        .card p { font-size: 13px; color: var(--dim); margin-bottom: 20px; line-height: 1.5; flex-grow: 1; }
        .card .price { font-size: 24px; font-weight: 800; color: var(--gold-soft); margin-bottom: 15px; }
        
        .btn-add { background: linear-gradient(135deg, #E9C463, #B8860B); color: #0A1A10; border: none; border-radius: 999px; padding: 12px 20px; font-weight: 800; font-size: 14px; cursor: pointer; width: 100%; transition: 0.3s; }
        .btn-add:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(212,175,55,.3); }

        .modal { position: fixed; inset: 0; background: rgba(2,10,6,0.8); backdrop-filter: blur(10px); z-index: 100; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal.on { display: flex; }
        .modal-box { background: linear-gradient(175deg, #0B2417, #071B11); border: 1px solid rgba(212,175,55,.4); border-radius: 28px; max-width: 500px; width: 100%; padding: 30px; max-height: 85vh; overflow-y: auto; position: relative; }
        .modal-x { position: absolute; top: 15px; right: 15px; background: none; border: none; color: var(--dim); font-size: 24px; cursor: pointer; }
        
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,.1); font-size: 14px; }
        .cart-total { display: flex; justify-content: space-between; font-size: 18px; font-weight: 700; color: var(--gold-soft); margin: 20px 0; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; color: var(--dim); margin-bottom: 5px; }
        .form-group input { width: 100%; background: rgba(0,0,0,.4); border: 1px solid rgba(255,255,255,.1); border-radius: 12px; color: var(--txt); padding: 12px; font-size: 14px; outline: none; }
        .form-group input:focus { border-color: var(--gold); }
        .btn-pay { background: linear-gradient(135deg, #E9C463, #B8860B); color: #0A1A10; border: none; border-radius: 999px; padding: 15px; font-weight: 800; font-size: 16px; cursor: pointer; width: 100%; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="header">
        <div style="display: flex; align-items: center; gap: 10px;">
            <div class="emblem">ТУТ</div>
            <div class="header-title serif">Премиум</div>
        </div>
        <button class="cart-btn" onclick="openCart()">Корзина (<span id="cartCount">0</span>)</button>
    </div>

    <div class="page-title">
        <h1>Витрина добавок</h1>
        <p>Разработано практикующим врачом. Уникальный состав на основе доказательной медицины.</p>
    </div>

    <div class="carousel-container" id="carousel"></div>

    <div class="modal" id="cartModal">
        <div class="modal-box">
            <button class="modal-x" onclick="closeCart()">✕</button>
            <h2 class="serif" style="text-align: center; color: var(--gold-soft); margin-bottom: 20px;">Ваш заказ</h2>
            
            <div id="cartItems"></div>
            <div class="cart-total">
                <span>Итого:</span>
                <span id="cartTotalPrice">0 ₽</span>
            </div>

            <div id="orderForm">
                <div class="form-group">
                    <label>Ваше имя</label>
                    <input type="text" id="userName" placeholder="Иван">
                </div>
                <div class="form-group">
                    <label>Телефон</label>
                    <input type="tel" id="userPhone" placeholder="+7 (999) 999-99-99">
                </div>
                <div class="form-group">
                    <label>Адрес доставки или ПВЗ</label>
                    <input type="text" id="userAddress" placeholder="Город, улица, дом или пункт выдачи">
                </div>
                <button class="btn-pay" onclick="submitOrder()">Перейти к оплате</button>
            </div>
        </div>
    </div>

    <script>
        // Данные товаров (без чувствительных данных)
        const products = [
            { id: 1, name: 'Магний бисглицинат', sub: 'Сон и восстановление', desc: '120 мг элементарного магния в капсуле. 90 капсул.', price: 1300 },
            { id: 2, name: 'Витамин D3', sub: 'Иммунитет и кости', desc: 'Капсулы для поддержки иммунитета.', price: 0 },
            { id: 3, name: 'Магний порошковый', sub: 'Большая банка', desc: 'Удобная форма для тех, кто не любит капсулы.', price: 0 },
            { id: 4, name: 'B-комплекс Премиум', sub: 'Энергия и нервная система', desc: 'Активные формы витаминов группы B.', price: 0 },
            { id: 5, name: 'Омега-3', sub: 'Сердце и мозг', desc: 'Высокая концентрация EPA/DHA.', price: 0 }
        ];

        const carousel = document.getElementById('carousel');
        
        // Безопасное создание элементов (защита от XSS)
        products.forEach(p => {
            const item = document.createElement('div');
            item.className = 'carousel-item';
            
            const card = document.createElement('div');
            card.className = 'card';
            
            const imgDiv = document.createElement('div');
            imgDiv.className = 'card-img';
            imgDiv.textContent = '💊'; // Можно заменить на картинку позже
            
            const h3 = document.createElement('h3');
            h3.textContent = p.name; // Безопасный вывод
            
            const sub = document.createElement('div');
            sub.className = 'subtitle';
            sub.textContent = p.sub;
            
            const desc = document.createElement('p');
            desc.textContent = p.desc;
            
            const price = document.createElement('div');
            price.className = 'price';
            price.textContent = p.price > 0 ? `${p.price} ₽` : 'Скоро';
            
            const btn = document.createElement('button');
            btn.className = 'btn-add';
            btn.textContent = 'В корзину';
            btn.onclick = () => addToCart(p.id);
            
            card.append(imgDiv, h3, sub, desc, price, btn);
            item.appendChild(card);
            carousel.appendChild(item);
        });

        // Логика карусели (IntersectionObserver)
        const items = document.querySelectorAll('.carousel-item');
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('active');
                } else {
                    entry.target.classList.remove('active');
                }
            });
        }, { root: carousel, threshold: 0.6 });
        items.forEach(item => observer.observe(item));

        // Корзина (хранится только в памяти браузера)
        let cart = [];
        
        function addToCart(id) {
            const product = products.find(p => p.id === id);
            if (product.price === 0) {
                alert('Этот товар пока в разработке. Мы сообщим о старте продаж!');
                return;
            }
            cart.push(product);
            updateCart();
            alert('Добавлено в корзину!');
        }

        function updateCart() {
            document.getElementById('cartCount').textContent = cart.length;
            const cartItems = document.getElementById('cartItems');
            const cartTotal = document.getElementById('cartTotalPrice');
            
            cartItems.textContent = ''; // Очистка безопасно
            
            if (cart.length === 0) {
                const empty = document.createElement('p');
                empty.style.textAlign = 'center';
                empty.style.color = 'var(--dim)';
                empty.textContent = 'Корзина пуста';
                cartItems.appendChild(empty);
                cartTotal.textContent = '0 ₽';
                return;
            }

            let total = 0;
            cart.forEach((item, index) => {
                const row = document.createElement('div');
                row.className = 'cart-item';
                
                const nameSpan = document.createElement('span');
                nameSpan.textContent = item.name;
                
                const priceSpan = document.createElement('span');
                priceSpan.textContent = `${item.price} ₽`;
                
                const delBtn = document.createElement('button');
                delBtn.textContent = '✕';
                delBtn.style.background = 'none';
                delBtn.style.border = 'none';
                delBtn.style.color = 'red';
                delBtn.style.cursor = 'pointer';
                delBtn.onclick = () => removeFromCart(index);
                
                row.append(nameSpan, priceSpan, delBtn);
                cartItems.appendChild(row);
                
                total += item.price;
            });
            cartTotal.textContent = `${total} ₽`;
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCart();
        }

        function openCart() {
            document.getElementById('cartModal').classList.add('on');
            updateCart();
        }

        function closeCart() {
            document.getElementById('cartModal').classList.remove('on');
        }

        function submitOrder() {
            const nameInput = document.getElementById('userName');
            const phoneInput = document.getElementById('userPhone');
            const addressInput = document.getElementById('userAddress');

            // Валидация
            if (!nameInput.value.trim() || !phoneInput.value.trim() || !addressInput.value.trim()) {
                alert('Пожалуйста, заполните все поля');
                return;
            }

            // В будущем здесь будет редирект на Робокассу.
            // Сейчас - заглушка.
            alert('Заказ оформлен! Сейчас мы перенаправим вас на страницу оплаты (функция в разработке).');
            // window.location.href = 'https://ваша-ссылка-робокассы';
        }
    </script>
</body>
</html>
